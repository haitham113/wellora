name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18.6-alpine3.23
        env:
          POSTGRES_DB: wellora_ci
          POSTGRES_USER: wellora_ci
          POSTGRES_PASSWORD: ci-ephemeral-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wellora_ci -d wellora_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8.10.1-alpine3.23
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 3000
      LOG_LEVEL: silent
      CORS_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql://wellora_ci:ci-ephemeral-password@localhost:5432/wellora_ci?schema=public
      DB_POOL_MAX: 5
      DB_CONNECT_TIMEOUT_MS: 3000
      REDIS_URL: redis://localhost:6379
      REDIS_CONNECT_TIMEOUT_MS: 3000
      JWT_ACCESS_SECRET: ci-jwt-access-secret-at-least-32-characters
      JWT_ISSUER: wellora-marketplace-ci
      JWT_AUDIENCE: wellora-api-ci
      JWT_ACCESS_TTL_SECONDS: 300
      REFRESH_TOKEN_TTL_SECONDS: 3600
      PASSWORD_RESET_TTL_SECONDS: 300
      EMAIL_VERIFICATION_TTL_SECONDS: 900
      ARGON2_MEMORY_COST_KIB: 19456
      ARGON2_TIME_COST: 2
      ARGON2_PARALLELISM: 1
      AUTH_METADATA_SECRET: ci-auth-metadata-secret-at-least-32-characters
      AUTH_RATE_LIMIT_MAX: 100
      AUTH_RATE_LIMIT_WINDOW_SECONDS: 60
      TRUST_PROXY_HOPS: 0
      SWAGGER_ENABLED: 'true'
      EXPECT_DEPENDENCIES_READY: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --omit=optional --audit-level=high

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Apply database migrations
        run: npm run prisma:migrate:deploy

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Run integration tests
        run: npm run test:integration

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Build runtime container
        run: docker build --target runtime --tag wellora-marketplace-api:ci .

      - name: Build migration container
        run: docker build --target migration --tag wellora-marketplace-migration:ci .

      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --quiet
